<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title th:text="${phieuMuon.maPhieu != null} ? 'Sửa Phiếu Mượn' : 'Thêm Phiếu Mượn'">Phiếu Mượn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/Image/logolibary.png">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #198754 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .form-wrapper {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .section-card {
            background: rgba(248, 250, 252, 0.8);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 1rem;
        }

        .form-label {
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 0.5rem;
        }

        .form-control, .form-select {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 0.875rem 1rem;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.9);
        }

        .form-control:focus {
            border-color: #198754;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            background: white;
        }

        .btn-primary {
            background: linear-gradient(135deg, #198754 0%, #764ba2 100%);
            border: none;
            padding: 0.875rem 2rem;
            font-weight: 600;
            border-radius: 12px;
        }

        .btn-secondary {
            background: #718096;
            border: none;
            padding: 0.875rem 2rem;
            font-weight: 600;
            border-radius: 12px;
        }

        .btn-outline-dark {
            border-radius: 12px;
            padding: 0.875rem 1.5rem;
        }

        .remove-book {
            padding: 0.5rem 0.75rem;
        }
    </style>
</head>
<body>
<div class="container animate-slide-in">
    <div class="form-wrapper">
        <form th:action="${phieuMuon.maPhieu != null} ? @{/admin/nhapmuon/sua(id=${phieuMuon.maPhieu})} : @{/admin/nhapmuon/them}"
              th:object="${phieuMuon}" method="post" id="phieuMuonForm">

            <h2 class="section-title">
                <i class="fas fa-exchange-alt text-success"></i>
                <span th:text="${phieuMuon.maPhieu != null} ? 'Sửa Phiếu Mượn' : 'Thêm Phiếu Mượn'">Thêm Phiếu Mượn</span>
            </h2>

            <!-- Thông tin mượn -->
            <div class="section-card">
                <h5 class="section-title"><i class="fas fa-info-circle text-primary"></i> Thông tin phiếu</h5>

                <div class="mb-3">
                    <label for="docGiaInput" class="form-label">Mã độc giả <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" th:field="*{docGia.maDocGia}" id="docGiaInput"
                           name="docGia.maDocGia" min="1" placeholder="Nhập mã độc giả (số)" required>
                    <small id="docGiaInfo" class="form-text text-muted"></small>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('docGia.maDocGia')}"
                         th:errors="*{docGia.maDocGia}"></div>
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Ngày mượn <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" th:field="*{ngayMuon}" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('ngayMuon')}" th:errors="*{ngayMuon}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Ngày hết hạn <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" th:field="*{ngayHetHan}" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('ngayHetHan')}" th:errors="*{ngayHetHan}"></div>
                    </div>
                </div>
            </div>

            <!-- Danh sách sách mượn -->
            <div class="section-card">
                <h5 class="section-title"><i class="fas fa-book text-primary"></i> Danh sách sách mượn</h5>
                <div id="bookList">
                    <div class="row g-2 align-items-center mb-2" th:each="ct, stat : *{chiTietPhieuMuons}">
                        <input type="hidden" th:field="*{chiTietPhieuMuons[__${stat.index}__].maChiTietPhieuMuon}">
                        <div class="col-md-6">
                            <input type="text" class="form-control" th:field="*{chiTietPhieuMuons[__${stat.index}__].sach.maSach}" placeholder="Mã sách" required>
                        </div>
                        <div class="col-md-5">
                            <input type="text" class="form-control" th:field="*{chiTietPhieuMuons[__${stat.index}__].ghiChu}" placeholder="Ghi chú (tuỳ chọn)">
                        </div>
                        <div class="col-md-1">
                            <button type="button" class="btn btn-sm btn-outline-danger remove-book"
                                    th:if="${#lists.size(chiTietPhieuMuons) > 1}">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <button type="button" class="btn btn-outline-primary mt-2" id="addBook">
                    <i class="fas fa-plus"></i> Thêm sách
                </button>
            </div>

            <!-- Buttons -->
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> Lưu</button>
                <button type="button" class="btn btn-secondary" onclick="clearForm()"><i class="fas fa-trash me-1"></i> Xóa form</button>
                <a href="/admin/nhapmuon" class="btn btn-outline-dark ms-auto"><i class="fas fa-arrow-left"></i> Quay lại</a>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("phieuMuonForm");
        const bookList = document.getElementById("bookList");
        const addBookBtn = document.getElementById("addBook");
        const docGiaInput = document.getElementById("docGiaInput");
        const docGiaInfo = document.getElementById("docGiaInfo");

        form.addEventListener("submit", function (e) {
            const required = form.querySelectorAll("[required]");
            let valid = true;
            required.forEach(input => {
                if (!input.value.trim()) {
                    input.classList.add("is-invalid");
                    valid = false;
                } else {
                    input.classList.remove("is-invalid");
                }
            });
            if (!valid) {
                e.preventDefault();
                alert("Vui lòng điền đầy đủ thông tin bắt buộc!");
            }
        });

        addBookBtn.addEventListener("click", function () {
            const newRow = document.createElement("div");
            newRow.className = "row g-2 align-items-center mb-2 book-entry";
            newRow.innerHTML = `
                <div class="col-md-6">
                    <input type="text" class="form-control" name="sachIds" placeholder="Mã sách" required>
                </div>
                <div class="col-md-5">
                    <input type="text" class="form-control" name="ghiChus" placeholder="Ghi chú">
                </div>
                <div class="col-md-1">
                    <button type="button" class="btn btn-sm btn-outline-danger remove-book"><i class="fas fa-trash"></i></button>
                </div>
            `;
            bookList.appendChild(newRow);
        });

        document.addEventListener("click", function (e) {
            if (e.target.closest(".remove-book")) {
                e.target.closest(".book-entry")?.remove();
            }
        });

        docGiaInput.addEventListener("blur", function () {
            const ma = this.value.trim();
            if (!ma) {
                docGiaInfo.textContent = "";
                return;
            }
            docGiaInfo.textContent = "🔄 Đang tìm...";
            fetch(`/api/docgia/${ma}`)
                .then(res => {
                    if (!res.ok) throw new Error("Không tìm thấy độc giả");
                    return res.json();
                })
                .then(data => {
                    docGiaInfo.textContent = `✔️ Tên: ${data.tenDocGia}`;
                    docGiaInfo.className = "form-text text-success";
                })
                .catch(() => {
                    docGiaInfo.textContent = "❌ Không tìm thấy độc giả";
                    docGiaInfo.className = "form-text text-danger";
                });
        });
    });

    function clearForm() {
        if (confirm("Bạn có chắc chắn muốn xóa dữ liệu trong form?")) {
            document.getElementById("phieuMuonForm").reset();
        }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trả Sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #198754 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem 0;
        }

        .container {
            max-width: 1100px;
        }

        .form-wrapper {
            background: #ffffffcc;
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #2d3748;
        }

        .info-row {
            margin-bottom: 1rem;
        }

        .info-label {
            font-weight: 600;
            color: #4a5568;
        }

        .table th, .table td {
            vertical-align: middle;
        }

        .btn-success {
            background: linear-gradient(135deg, #198754 0%, #764ba2 100%);
            border: none;
            padding: 0.75rem 2rem;
            font-weight: 600;
            border-radius: 12px;
        }

        .btn-secondary {
            background-color: #718096;
            border: none;
            padding: 0.75rem 2rem;
            font-weight: 600;
            border-radius: 12px;
        }

        .form-control {
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="form-wrapper">
        <h2 class="section-title"><i class="fa-solid fa-arrow-rotate-left text-success me-2"></i> Trả sách - Phiếu mượn 
            <span th:if="${phieu != null}" th:text="'#' + ${phieu.maPhieu}"></span>
            <span th:unless="${phieu != null}">---</span>
        </h2>

        <div class="row info-row">
            <div class="col-md-4">
                <div class="info-label">Độc giả:</div>
                <div>
                    <span th:if="${phieu != null and phieu.docGia != null}" th:text="${phieu.docGia.tenDocGia}"></span>
                    <span th:unless="${phieu != null and phieu.docGia != null}">Không rõ</span>
                </div>
            </div>
            <div class="col-md-4">
                <div class="info-label">Ngày mượn:</div>
                <div>
                    <span th:if="${phieu != null and phieu.ngayMuon != null}" th:text="${#temporals.format(phieu.ngayMuon, 'dd/MM/yyyy')}"></span>
                    <span th:unless="${phieu != null and phieu.ngayMuon != null}">---</span>
                </div>
            </div>
            <div class="col-md-4">
                <div class="info-label">Hạn trả:</div>
                <div>
                    <span th:if="${phieu != null and phieu.ngayHetHan != null}" th:text="${#temporals.format(phieu.ngayHetHan, 'dd/MM/yyyy')}"></span>
                    <span th:unless="${phieu != null and phieu.ngayHetHan != null}">---</span>
                </div>
            </div>
        </div>

        <form th:action="@{/admin/nhapmuon/xacnhan-tra}" method="post">
            <input type="hidden" name="maPhieuMuon" th:value="${phieu != null ? phieu.maPhieu : ''}" />

            <div class="table-responsive mt-4">
                <table class="table table-bordered align-middle">
                    <thead class="table-light text-center">
                        <tr>
                            <th style="width: 45%;">Tên sách</th>
                            <th>Ghi chú</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="ct : ${chiTietList}">
                            <td th:text="${ct.sach != null ? ct.sach.tenSach : 'Không rõ'}">Tên sách</td>
                            <td>
                                <input type="text" class="form-control" name="ghiChuList" th:value="${ct.ghiChu}" placeholder="Ghi chú nếu có" readonly>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(chiTietList)}">
                            <td colspan="3" class="text-center text-muted">Không có sách cần trả.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex gap-2 justify-content-between mt-4">
                <a th:href="@{/admin/nhapmuon}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left me-1"></i> Quay lại
                </a>
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-check me-1"></i> Xác nhận trả sách
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Nạp tiền vào tài khoản</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #198754 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .form-wrapper {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .form-label {
            font-weight: 600;
            color: #4a5568;
            font-size: 0.95rem;
        }

        .form-control {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 0.875rem 1rem;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.9);
        }

        .form-control:focus {
            border-color: #198754;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            background: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #198754 0%, #764ba2 100%);
            border: none;
            padding: 0.875rem 2rem;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #718096;
            border: none;
            padding: 0.875rem 2rem;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: #4a5568;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(113, 128, 150, 0.3);
        }

        h3 {
            color: #2d3748;
            font-weight: 700;
            margin-bottom: 2rem;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container animate-slide-in">
    <div class="form-wrapper">
<h3>
  <i class="fas fa-wallet me-2 text-success"></i>
  Nạp tiền cho 
  <span class="text-primary fw-bold" th:text="${username}">Username</span>
</h3>
        

        <form th:action="@{/admin/docgia/naptien}" method="post">
            <input type="hidden" name="maTaiKhoan" th:value="${maTaiKhoan}" />

            <div class="mb-3">
                <label for="soTien" class="form-label">Số tiền cần nạp (VNĐ):</label>
                <input type="number" class="form-control" id="soTien" name="soTien" min="1000" step="1000" required>
            </div>

            <div class="d-flex justify-content-between mt-4">
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-check-circle me-2"></i>Xác nhận nạp tiền
                </button>
                <a th:href="@{/admin/docgia}" class="btn btn-secondary">
                    <i class="fas fa-times-circle me-2"></i>Hủy
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    document.querySelector('form')?.addEventListener('submit', function (e) {
        const input = document.getElementById('soTien');
        if (input.value < 1000 || input.value % 1000 !== 0) {
            e.preventDefault();
            alert('Số tiền phải lớn hơn hoặc bằng 1.000 VNĐ và chia hết cho 1.000!');
            input.focus();
        }
    });
</script>
</body>
</html>
